name: Deploy AWS Lambda

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"   

      # Run tests — blocks deploy if these fail
      - name: Run Locale Parity Test
        run: |
          python tests/test_locale_parity.py

      # Create deployment package
      - name: Install Dependencies
        run: |
          mkdir package
          pip install -r requirements.txt -t package

      # Copy all Python files
      - name: Copy Project Files
        run: |
          cp *.py package/
          cp -r locales package/locales

      # Create ZIP
      - name: Create ZIP
        run: |
          cd package
          zip -r ../lambda.zip .

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1    

      # Deploy to Development Lambda
      - name: Deploy Development Lambda
        if: github.ref == 'refs/heads/develop'
        run: |
          aws lambda update-function-code \
            --function-name app-razorpay-dev \
            --zip-file fileb://lambda.zip

      # Deploy to Production Lambda
      - name: Deploy Production Lambda
        if: github.ref == 'refs/heads/main'
        run: |
          aws lambda update-function-code \
            --function-name app-razorpay-dev \
            --zip-file fileb://lambda.zip
